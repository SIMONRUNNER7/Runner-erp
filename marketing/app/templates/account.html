{% extends "base.html" %}
{% block title %}Mon compte — Runner Golf Social{% endblock %}
{% block content %}
<div class="topbar"><h1>Mon compte</h1></div>

<div class="card" style="max-width:420px;">
  <strong>{{ current_user.name }}</strong>
  <p class="helptext">{{ current_user.email }} · {{ 'Admin' if is_admin else 'Éditeur' }}</p>
</div>

<div class="card" style="max-width:420px;">
  <strong>Changer mon mot de passe</strong>
  <form method="post" action="/account/password">
    <label>Mot de passe actuel</label>
    <input type="password" name="current_password" required>
    <label>Nouveau mot de passe</label>
    <input type="password" name="new_password" required minlength="8">
    <label>Confirmer le nouveau mot de passe</label>
    <input type="password" name="confirm_password" required minlength="8">
    <button class="btn" type="submit" style="margin-top:16px;">Mettre à jour</button>
  </form>
</div>
{% endblock %}
