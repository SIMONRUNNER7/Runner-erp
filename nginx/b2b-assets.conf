# Add this location block inside your existing erp.runner.golf server block
# (inside the server { listen 443 ssl; server_name erp.runner.golf; } block)

location /b2b-assets/ {
    alias /var/www/runner-erp/frontend-b2b/dist/;

    # Allow Shopify to load these assets cross-origin
    add_header Access-Control-Allow-Origin "https://runner.golf";
    add_header Access-Control-Allow-Methods "GET, OPTIONS";

    # Cache assets aggressively (they have hashed names)
    expires 1y;
    add_header Cache-Control "public, immutable";

    # app.js and app.css have no hash — shorter cache
    location ~* /b2b-assets/app\.(js|css)$ {
        alias /var/www/runner-erp/frontend-b2b/dist/;
        add_header Access-Control-Allow-Origin "https://runner.golf";
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }
}
